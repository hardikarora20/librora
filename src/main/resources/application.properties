# ==========================================================
# Librora backend - application.properties
# Development database strategy: H2 in file mode (Section 15)
# ==========================================================

spring.application.name=librora

# --- Server ---
server.port=8080

# --- H2 file-mode database ---
# File mode (not pure in-memory) so seeded data + progress survive restarts.
spring.datasource.url=jdbc:h2:file:./data/librora;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 console (dev only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CORS: allow React dev server origin (Vite default port) ---
app.cors.allowed-origin=http://localhost:5173
